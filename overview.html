<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Overview | Old Skool DJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0a14;
      --bg-2: #1a1226;
      --card: #1f1630;
      --card-hover: #2a1e40;
      --field: #150f21;
      --text: #f3eefc;
      --muted: #a99bc4;
      --pink: #ff3ea5;
      --cyan: #2de2e6;
      --yellow: #ffd23f;
      --green: #3ddc84;
      --red: #ff5a5a;
      --track: rgba(255, 255, 255, 0.05);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 210, 63, 0.12), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(255, 62, 165, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 8px;
    }

    .logo {
      font-family: 'Monoton', cursive;
      font-size: 1.5rem;
      background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 10px;
      transition: color 0.2s, background 0.2s;
    }

    .back-link:hover { color: var(--text); background: var(--card); }

    main {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 { font-size: 1.6rem; font-weight: 800; }
    h2 { font-size: 1.2rem; font-weight: 700; }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .card-head .sub { color: var(--muted); font-size: 0.9rem; }

    /* ---------- Headline numbers ---------- */
    .hero {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) { .hero { grid-template-columns: 1fr 1fr; } .hero .total { grid-column: 1 / -1; } }

    .tile {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius);
      padding: 20px 22px;
    }

    .tile .label { color: var(--muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .tile .value { font-size: 2.2rem; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .tile.total { border-color: rgba(255, 210, 63, 0.35); }
    .tile.total .value { font-size: 3.2rem; }
    .tile .note { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

    /* ---------- Bar rows (decades and artists) ---------- */
    .bars { display: flex; flex-direction: column; gap: 4px; }

    .bar-row {
      display: grid;
      grid-template-columns: 90px 1fr 92px;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: default;
      transition: background 0.15s;
    }

    .bar-row:hover, .bar-row:focus-visible { background: var(--card-hover); outline: none; }

    .bar-row.artist-row { grid-template-columns: minmax(0, 1.2fr) 1fr 56px; }

    .bar-label { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .bar-track { height: 18px; background: var(--track); border-radius: 4px; overflow: hidden; }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--pink);
      border-radius: 0 4px 4px 0;
      transition: width 0.6s ease;
    }

    .artist-row .bar-track { height: 12px; }
    .artist-row .bar-fill { background: var(--cyan); }

    .bar-value { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
    .bar-value small { color: var(--muted); font-size: 0.8rem; margin-left: 4px; }

    .empty-dec .bar-label, .empty-dec .bar-value { color: var(--muted); }

    /* ---------- Artist controls ---------- */
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

    .controls input {
      flex: 1;
      min-width: 180px;
      padding: 12px 14px;
      background: var(--field);
      color: var(--text);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
    }

    .controls input:focus { outline: none; border-color: var(--cyan); }

    .seg {
      display: inline-flex;
      background: var(--field);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .seg button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 14px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .seg button[aria-pressed="true"] { background: var(--card-hover); color: var(--text); }

    .more {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      cursor: pointer;
    }

    .more:hover { color: var(--text); border-color: var(--muted); }

    .empty { text-align: center; color: var(--muted); padding: 20px 8px; }

    /* ---------- Tooltip ---------- */
    .tip {
      position: fixed;
      pointer-events: none;
      background: var(--bg-2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 20;
      max-width: 260px;
    }

    .tip.show { opacity: 1; }
    .tip b { display: block; margin-bottom: 2px; }
    .tip span { color: var(--muted); }

    .status {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 90, 90, 0.12);
      border: 1px solid var(--red);
    }

    .loading { color: var(--muted); text-align: center; padding: 40px 0; }

    .hidden { display: none !important; }

    footer { text-align: center; padding: 20px 16px 28px; color: var(--muted); font-size: 0.85rem; }

    @media (max-width: 460px) {
      .bar-row { grid-template-columns: 64px 1fr 72px; gap: 8px; }
      .bar-value small { display: none; }
    }

    @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Old Skool DJ</a>
    <a href="index.html" class="back-link">&larr; Home</a>
  </header>

  <main>
    <h1>Library Overview</h1>

    <p class="loading" id="loading">Counting your records…</p>
    <div class="status hidden" id="error" role="alert"></div>

    <div id="content" class="hidden" style="display:flex;flex-direction:column;gap:20px;">

      <!-- Total Tracks -->
      <section class="hero" aria-label="Library totals">
        <div class="tile total">
          <div class="label">Total Tracks in Library</div>
          <div class="value" id="totalTracks">0</div>
          <div class="note" id="yearSpan"></div>
        </div>
        <div class="tile">
          <div class="label">Artists</div>
          <div class="value" id="totalArtists">0</div>
        </div>
        <div class="tile">
          <div class="label">Decades</div>
          <div class="value" id="totalDecades">0</div>
        </div>
      </section>

      <!-- Tracks By Decade -->
      <section class="card">
        <div class="card-head">
          <h2>Tracks By Decade</h2>
          <span class="sub" id="topDecade"></span>
        </div>
        <div class="bars" id="decadeBars" role="list"></div>
      </section>

      <!-- Tracks By Artist -->
      <section class="card">
        <div class="card-head">
          <h2>Tracks By Artist</h2>
          <span class="sub" id="artistSub"></span>
        </div>

        <div class="controls">
          <input type="search" id="artistSearch" placeholder="Find an artist…" autocomplete="off" aria-label="Find an artist">
          <div class="seg" role="group" aria-label="Sort artists">
            <button type="button" id="sortCount" aria-pressed="true">Most tracks</button>
            <button type="button" id="sortName" aria-pressed="false">A–Z</button>
          </div>
        </div>

        <div class="bars" id="artistBars" role="list"></div>
        <button type="button" class="more hidden" id="showMore"></button>
      </section>

    </div>
  </main>

  <footer>Old Skool DJ &middot; Keep the classics spinning</footer>

  <div class="tip" id="tip" role="tooltip"></div>

  <script type="module">
    import { db, TRACKS_COLLECTION } from "./firebase-config.js";
    import { collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const PAGE_SIZE = 25;
    const $ = id => document.getElementById(id);
    const fmt = n => n.toLocaleString();

    let total = 0;
    let artists = [];          // [{ name, count, years:{min,max} }]
    let sortBy = "count";
    let shown = PAGE_SIZE;

    // ---------- Tooltip ----------
    const tip = $("tip");

    function attachTip(el, title, detail) {
      const show = e => {
        tip.innerHTML = "";
        const b = document.createElement("b");
        b.textContent = title;
        const s = document.createElement("span");
        s.textContent = detail;
        tip.append(b, s);
        tip.classList.add("show");
        move(e);
      };
      const move = e => {
        const r = el.getBoundingClientRect();
        const x = e && e.clientX ? e.clientX : r.left + r.width / 2;
        const y = e && e.clientY ? e.clientY : r.top;
        const w = tip.offsetWidth;
        tip.style.left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8) + "px";
        tip.style.top = Math.max(8, y - tip.offsetHeight - 12) + "px";
      };
      const hide = () => tip.classList.remove("show");
      el.addEventListener("mouseenter", show);
      el.addEventListener("mousemove", move);
      el.addEventListener("mouseleave", hide);
      el.addEventListener("focus", () => show());
      el.addEventListener("blur", hide);
    }

    // ---------- One bar row ----------
    function barRow({ label, count, max, valueText, tipTitle, tipText, className = "" }) {
      const row = document.createElement("div");
      row.className = `bar-row ${className}`;
      row.setAttribute("role", "listitem");
      row.tabIndex = 0;

      const lab = document.createElement("div");
      lab.className = "bar-label";
      lab.textContent = label;

      const trackEl = document.createElement("div");
      trackEl.className = "bar-track";
      const fill = document.createElement("div");
      fill.className = "bar-fill";
      trackEl.appendChild(fill);

      const val = document.createElement("div");
      val.className = "bar-value";
      val.textContent = fmt(count);
      if (valueText) {
        const small = document.createElement("small");
        small.textContent = valueText;
        val.appendChild(small);
      }

      row.append(lab, trackEl, val);
      row.setAttribute("aria-label", `${label}: ${fmt(count)} tracks${valueText ? ", " + valueText : ""}`);
      attachTip(row, tipTitle, tipText);

      requestAnimationFrame(() => { fill.style.width = max ? `${(count / max) * 100}%` : "0%"; });
      return row;
    }

    const pct = n => total ? `${((n / total) * 100).toFixed(n / total < 0.1 ? 1 : 0)}%` : "0%";

    // ---------- Load ----------
    async function load() {
      try {
        const snap = await getDocs(collection(db, TRACKS_COLLECTION));
        const decadeCounts = new Map();
        const artistMap = new Map();
        let minYear = Infinity, maxYear = -Infinity;

        snap.docs.forEach(d => {
          const t = d.data();
          if (!t.track) return;
          total++;

          const year = Number(t.year);
          if (Number.isInteger(year)) {
            minYear = Math.min(minYear, year);
            maxYear = Math.max(maxYear, year);
            const dec = year - (year % 10);
            decadeCounts.set(dec, (decadeCounts.get(dec) || 0) + 1);
          }

          const name = (t.artist || "").trim();
          if (name) {
            const key = name.toLowerCase();
            const a = artistMap.get(key) || { name, count: 0, min: Infinity, max: -Infinity };
            a.count++;
            if (Number.isInteger(year)) { a.min = Math.min(a.min, year); a.max = Math.max(a.max, year); }
            artistMap.set(key, a);
          }
        });

        artists = [...artistMap.values()];

        // Totals
        $("totalTracks").textContent = fmt(total);
        $("totalArtists").textContent = fmt(artists.length);
        $("totalDecades").textContent = fmt(decadeCounts.size);
        $("yearSpan").textContent = total ? `Spanning ${minYear} – ${maxYear}` : "No tracks yet";

        renderDecades(decadeCounts);
        renderArtists();

        $("loading").classList.add("hidden");
        $("content").classList.remove("hidden");
      } catch (err) {
        console.error(err);
        $("loading").classList.add("hidden");
        const e = $("error");
        e.textContent = `Couldn't load your library: ${err.message}`;
        e.classList.remove("hidden");
      }
    }

    // ---------- Decades ----------
    function renderDecades(counts) {
      const box = $("decadeBars");
      box.innerHTML = "";
      if (!counts.size) {
        box.innerHTML = '<div class="empty">No tracks yet.</div>';
        return;
      }

      const decades = [...counts.keys()].sort((a, b) => a - b);
      const max = Math.max(...counts.values());

      // Include any empty decades in between so gaps are visible
      for (let dec = decades[0]; dec <= decades[decades.length - 1]; dec += 10) {
        const n = counts.get(dec) || 0;
        box.appendChild(barRow({
          label: `${dec}s`,
          count: n,
          max,
          valueText: pct(n),
          tipTitle: `${dec}s`,
          tipText: `${fmt(n)} track${n === 1 ? "" : "s"} · ${pct(n)} of your library`,
          className: n ? "" : "empty-dec"
        }));
      }

      const [bestDec, bestN] = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
      $("topDecade").textContent = `Biggest: the ${bestDec}s with ${fmt(bestN)} tracks`;
    }

    // ---------- Artists ----------
    function renderArtists() {
      const box = $("artistBars");
      const query = $("artistSearch").value.trim().toLowerCase();
      box.innerHTML = "";

      let list = artists.filter(a => !query || a.name.toLowerCase().includes(query));
      list.sort(sortBy === "count"
        ? (a, b) => b.count - a.count || a.name.localeCompare(b.name)
        : (a, b) => a.name.localeCompare(b.name));

      $("artistSub").textContent = query
        ? `${fmt(list.length)} matching artist${list.length === 1 ? "" : "s"}`
        : `${fmt(artists.length)} artists`;

      if (!list.length) {
        box.innerHTML = '<div class="empty">No artists match that.</div>';
        $("showMore").classList.add("hidden");
        return;
      }

      const max = Math.max(...artists.map(a => a.count));

      list.slice(0, shown).forEach(a => {
        const span = a.min === Infinity ? "" : a.min === a.max ? `${a.min}` : `${a.min}–${a.max}`;
        box.appendChild(barRow({
          label: a.name,
          count: a.count,
          max,
          tipTitle: a.name,
          tipText: `${fmt(a.count)} track${a.count === 1 ? "" : "s"}${span ? " · " + span : ""}`,
          className: "artist-row"
        }));
      });

      const more = $("showMore");
      if (list.length > shown) {
        const next = Math.min(PAGE_SIZE * 4, list.length - shown);
        more.textContent = `Show ${fmt(next)} more (${fmt(list.length - shown)} left)`;
        more.classList.remove("hidden");
      } else {
        more.classList.add("hidden");
      }
    }

    let timer;
    $("artistSearch").addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { shown = PAGE_SIZE; renderArtists(); }, 120);
    });

    function setSort(which) {
      sortBy = which;
      shown = PAGE_SIZE;
      $("sortCount").setAttribute("aria-pressed", which === "count");
      $("sortName").setAttribute("aria-pressed", which === "name");
      renderArtists();
    }

    $("sortCount").addEventListener("click", () => setSort("count"));
    $("sortName").addEventListener("click", () => setSort("name"));
    $("showMore").addEventListener("click", () => { shown += PAGE_SIZE * 4; renderArtists(); });

    load();
  </script>

</body>
</html>
