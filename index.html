<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old Skool DJ | Music Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0a14;
      --bg-2: #1a1226;
      --card: #1f1630;
      --card-hover: #2a1e40;
      --text: #f3eefc;
      --muted: #a99bc4;
      --pink: #ff3ea5;
      --cyan: #2de2e6;
      --yellow: #ffd23f;
      --orange: #ff8a3d;
      --green: #3ddc84;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 62, 165, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(45, 226, 230, 0.15), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    header {
      text-align: center;
      padding: 48px 16px 24px;
    }

    .vinyl {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      animation: spin 4s linear infinite;
      filter: drop-shadow(0 0 18px rgba(255, 62, 165, 0.45));
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: 'Monoton', cursive;
      font-weight: 400;
      font-size: clamp(2.4rem, 8vw, 4.8rem);
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
    }

    .tagline {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.05rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ---------- Search buttons ---------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .section-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .search-btn {
      --accent: var(--pink);
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      padding: 26px 24px;
      background: var(--card);
      color: var(--text);
      border: 2px solid transparent;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .search-btn:hover,
    .search-btn:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      box-shadow: 0 0 24px -4px var(--accent);
      transform: translateY(-3px);
      outline: none;
    }

    .search-btn:active { transform: translateY(0); }

    .search-btn .icon {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
    }

    .search-btn .icon svg { width: 28px; height: 28px; }

    .search-btn small {
      display: block;
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
    }

    .btn-track    { --accent: var(--pink); }
    .btn-artist   { --accent: var(--cyan); }
    .btn-year     { --accent: var(--yellow); }
    .btn-category { --accent: var(--orange); }
    .btn-update   { --accent: var(--green); }

    /* Update button sits on its own row, below the searches */
    .manage-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 32px 0 20px;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .manage-divider::before,
    .manage-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-overview { --accent: var(--yellow); }

    .btn-update,
    .btn-overview {
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
    }

    /* ---------- Toast (placeholder until features are built) ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(120px);
      background: var(--bg-2);
      border: 1px solid var(--pink);
      color: var(--text);
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 0.95rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
      max-width: calc(100% - 32px);
      text-align: center;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      padding: 20px 16px 28px;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (prefers-reduced-motion: reduce) {
      .vinyl { animation: none; }
      .search-btn, .toast { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <!-- Spinning vinyl record -->
    <svg class="vinyl" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="58" fill="#111" stroke="#333" stroke-width="2"/>
      <circle cx="60" cy="60" r="48" fill="none" stroke="#222" stroke-width="1"/>
      <circle cx="60" cy="60" r="40" fill="none" stroke="#222" stroke-width="1"/>
      <circle cx="60" cy="60" r="32" fill="none" stroke="#222" stroke-width="1"/>
      <circle cx="60" cy="60" r="22" fill="#ff3ea5"/>
      <circle cx="60" cy="60" r="14" fill="#ffd23f"/>
      <circle cx="60" cy="60" r="3" fill="#0d0a14"/>
      <path d="M 30 25 A 45 45 0 0 1 60 15" stroke="rgba(255,255,255,0.25)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>

    <h1>Old Skool DJ</h1>
    <p class="tagline">Music Library</p>
  </header>

  <main>
    <p class="section-title">How do you want to find your tracks?</p>

    <div class="search-grid">

      <button class="search-btn btn-track" data-page="search-track.html" data-label="Search By Track Name">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <span>Search By Track Name<small>Find a song by its title</small></span>
      </button>

      <button class="search-btn btn-artist" data-page="search-artist.html" data-label="Search By Artist Name">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
        </span>
        <span>Search By Artist Name<small>Browse tracks by performer</small></span>
      </button>

      <button class="search-btn btn-year" data-page="search-year.html" data-label="Search By Year or Decade">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </span>
        <span>Search By Year or Decade<small>70s, 80s, 90s and beyond</small></span>
      </button>

      <button class="search-btn btn-category" data-page="search-category.html" data-label="Search By Track Category">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
        </span>
        <span>Search By Track Category<small>Disco, Soul, House, Funk…</small></span>
      </button>

    </div>

    <div class="manage-divider">Manage</div>

    <div class="search-grid">

    <a href="overview.html" class="search-btn btn-overview">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/></svg>
      </span>
      <span>Library Overview<small>Totals by decade and artist</small></span>
    </a>

    <!-- Plain link: always opens the Update Track Library menu -->
    <a href="update-library.html" class="search-btn btn-update">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </span>
      <span>Update Track Library<small>Add, edit or remove tracks</small></span>
    </a>

    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> Old Skool DJ &middot; Keep the classics spinning
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Set to true once each search page has been built.
    // While false, clicking a button shows a "coming soon" message.
    const PAGES_READY = {
      'search-track.html': true,
      'search-artist.html': false,
      'search-year.html': false,
      'search-category.html': false
    };

    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    document.querySelectorAll('button.search-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const page = btn.dataset.page;
        if (PAGES_READY[page]) {
          window.location.href = page;
        } else {
          showToast(`🎧 ${btn.dataset.label} — coming soon!`);
        }
      });
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
